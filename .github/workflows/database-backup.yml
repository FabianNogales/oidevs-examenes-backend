name: EIDA manual database backup
run-name: EIDA backup ${{ inputs.backup_id }}

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: UUID issued by Laravel (never credentials)
        required: true
        type: string

permissions:
  contents: read

# Serialize the whole database. Never cancel an in-flight backup for a new request.
concurrency:
  group: eida-database-backup
  cancel-in-progress: false

jobs:
  backup:
    # This branch must be protected and allowed by the environment before enabling Laravel.
    if: github.ref == 'refs/heads/backup-execution'
    environment: eida-backups
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare isolated Python runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/eida-backup-python"
      - name: Run authenticated backup executor
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          BACKUP_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          BACKUP_CALLBACK_URL: ${{ secrets.EIDA_BACKUPS_CALLBACK_URL || vars.EIDA_BACKUPS_CALLBACK_URL }}
          BACKUP_CALLBACK_SECRET: ${{ secrets.EIDA_BACKUPS_CALLBACK_SECRET || vars.EIDA_BACKUPS_CALLBACK_SECRET }}
          PGHOST: ${{ secrets.EIDA_BACKUPS_PGHOST || vars.EIDA_BACKUPS_PGHOST }}
          PGPORT: ${{ secrets.EIDA_BACKUPS_PGPORT || vars.EIDA_BACKUPS_PGPORT }}
          PGDATABASE: ${{ secrets.EIDA_BACKUPS_PGDATABASE || vars.EIDA_BACKUPS_PGDATABASE }}
          PGUSER: ${{ secrets.EIDA_BACKUPS_PGUSER || vars.EIDA_BACKUPS_PGUSER }}
          PGPASSWORD: ${{ secrets.EIDA_BACKUPS_PGPASSWORD || vars.EIDA_BACKUPS_PGPASSWORD }}
          PGSSLMODE: ${{ secrets.EIDA_BACKUPS_PGSSLMODE || vars.EIDA_BACKUPS_PGSSLMODE }}
          BACKUP_PG_CA_PEM: ${{ secrets.EIDA_BACKUPS_PG_CA_PEM || vars.EIDA_BACKUPS_PG_CA_PEM }}
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.EIDA_BACKUPS_DRIVE_CLIENT_ID || vars.EIDA_BACKUPS_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.EIDA_BACKUPS_DRIVE_CLIENT_SECRET || vars.EIDA_BACKUPS_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.EIDA_BACKUPS_DRIVE_REFRESH_TOKEN || vars.EIDA_BACKUPS_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_FOLDER_ID: ${{ secrets.EIDA_BACKUPS_DRIVE_FOLDER_ID || vars.EIDA_BACKUPS_DRIVE_FOLDER_ID }}
        run: '"$RUNNER_TEMP/eida-backup-python/bin/python" scripts/backups/executor.py'
      # No upload-artifact, deployment, restore, or automatic retention/deletion.
